name: A-Frame Brands
description: 'A-Frame Brands is a Venice, California based consumer brand incubator and product development
  platform founded in 2019 by Ari Bloom and Hill Harper. It builds and grows purpose-driven personal
  care, beauty, suncare, baby care, home care, and pet care brands, frequently in partnership with
  celebrity and talent founders such as John Legend, Naomi Osaka, Gabrielle Union, and Dwyane Wade, with
  a focus on products formulated for historically underserved and melanin-rich consumers. Its portfolio
  includes Loved01, Kinlo, Proudly, and Purrfect Paws, distributed direct-to-consumer and across more than
  10,000 national retail locations including Walmart, Target, CVS, and Amazon. Backed by Forerunner
  Ventures. This is a consumer company profile in the API Evangelist network; it publishes no public
  developer API surface.'
